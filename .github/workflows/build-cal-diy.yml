name: Build Cal.diy for Dokploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - scripts/**
      - apps/**
      - packages/**
      - .yarn/**
      - package.json
      - yarn.lock
      - turbo.json
      - .yarnrc.yml
      - .github/workflows/build-cal-diy.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: caldiy-main-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the DXBMARK fork
        uses: actions/checkout@v4

      - name: Free some disk space before the monorepo Docker build
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build from fork and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dxbmark/cal-diy:main
            ghcr.io/dxbmark/cal-diy:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/DXBMARK/cal.diy
            org.opencontainers.image.description=Cal.diy web app built from the DXBMARK fork
          # Build-only, NON-SECRET placeholders. NEVER pass production secrets here.
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://cal.dxbmark.com
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            NEXTAUTH_SECRET=BUILD_ONLY_NOT_A_RUNTIME_SECRET_123
            CALENDSO_ENCRYPTION_KEY=00000000000000000000000000000000
            DATABASE_URL=postgresql://build:build@localhost:5432/build
            MAX_OLD_SPACE_SIZE=6144
